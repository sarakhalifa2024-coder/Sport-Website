<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News Hub - Player Statistics</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#0f172a',
                        accent: '#f97316',
                        background: '#f8fafc',
                        foreground: '#0f172a',
                        muted: '#64748b',
                        card: '#ffffff',
                        'card-border': '#e2e8f0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">Sports Hub</a>
        <ul>
            <li><a href="home.html" class="nav-link">Home</a></li>
            <li><a href="standings.html" class="nav-link">Standings</a></li>
            <li><a href="live.html" class="nav-link">Live</a></li>
            <li><a href="stats.html" class="nav-link active">Stats</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        <!-- Page Header -->
        <div class="text-center mb-5">
            <h1 class="text-4xl font-bold text-foreground mb-2">
                <i class="bi bi-bar-chart-fill text-primary me-2"></i>
                Player Statistics
            </h1>
            <p class="text-muted">Top performers of the season</p>
        </div>

        <!-- Sort Options -->
        <div class="flex justify-center gap-3 mb-5">
            <button class="btn btn-primary px-4" onclick="sortStats('goals')" id="sort-goals">
                <i class="bi bi-bullseye me-1"></i> Goals
            </button>
            <button class="btn btn-outline-warning px-4" onclick="sortStats('yellow')" id="sort-yellow">
                <i class="bi bi-card-text me-1"></i> Yellow Cards
            </button>
            <button class="btn btn-outline-danger px-4" onclick="sortStats('red')" id="sort-red">
                <i class="bi bi-card-text me-1"></i> Red Cards
            </button>
        </div>

        <!-- Stats Grid -->
        <div class="row g-4">
            <!-- Top Scorers -->
            <div class="col-lg-4">
                <div class="stats-card h-100">
                    <div class="stats-card-header scorers">
                        <i class="bi bi-bullseye me-2"></i>
                        Top Scorers
                    </div>
                    <div id="top-scorers">
                        <div class="text-center py-5">
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Yellow Cards -->
            <div class="col-lg-4">
                <div class="stats-card h-100">
                    <div class="stats-card-header yellow">
                        <i class="bi bi-card-text me-2"></i>
                        Yellow Cards
                    </div>
                    <div id="yellow-cards">
                        <div class="text-center py-5">
                            <div class="spinner-border text-warning" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Red Cards -->
            <div class="col-lg-4">
                <div class="stats-card h-100">
                    <div class="stats-card-header red">
                        <i class="bi bi-card-text me-2"></i>
                        Red Cards
                    </div>
                    <div id="red-cards">
                        <div class="text-center py-5">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-secondary text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Sports Hub. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="stats.js"></script>
</body>
</html>
