<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News Hub - League Standings</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#0f172a',
                        accent: '#f97316',
                        background: '#f8fafc',
                        foreground: '#0f172a',
                        muted: '#64748b',
                        card: '#ffffff',
                        'card-border': '#e2e8f0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen">
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">Sports Hub</a>
        <ul>
            <li><a href="home.html" class="nav-link">Home</a></li>
            <li><a href="standings.html" class="nav-link active">Standings</a></li>
            <li><a href="live.html" class="nav-link">Live</a></li>
            <li><a href="stats.html" class="nav-link">Stats</a></li>
        </ul>
    </nav>

    <div class="container py-4">

        <div class="text-center mb-5">
            <h1 class="text-4xl font-bold text-foreground mb-2">
                <i class="bi bi-trophy text-amber-500 me-2"></i>
                League Standings
            </h1>
            <p class="text-muted">Current season standings and team statistics</p>
        </div>

        <div class="card border-0 shadow-lg rounded-xl overflow-hidden">
            <div class="card-header bg-gradient-to-r from-primary to-blue-500 text-white border-0 py-4">
                <div class="flex items-center justify-between">
                    <h5 class="mb-0 flex items-center gap-2">
                        <i class="bi bi-table"></i>
                        Premier League 2025/2026
                    </h5>
                    <span class="badge bg-white text-primary">Season Standings</span>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table standings-table mb-0">
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 50px;">#</th>
                                <th>Team</th>
                                <th class="text-center">P</th>
                                <th class="text-center">W</th>
                                <th class="text-center">D</th>
                                <th class="text-center">L</th>
                                <th class="text-center">GF</th>
                                <th class="text-center">GA</th>
                                <th class="text-center">GD</th>
                                <th class="text-center">Pts</th>
                            </tr>
                        </thead>
                        <tbody id="standings-table">
                            <tr>
                                <td colspan="10" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4 flex flex-wrap gap-4 justify-center">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-green-500"></div>
                <span class="text-sm text-muted">Champions League</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-blue-500"></div>
                <span class="text-sm text-muted">Europa League</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-amber-500"></div>
                <span class="text-sm text-muted">Conference League</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-red-500"></div>
                <span class="text-sm text-muted">Relegation</span>
            </div>
        </div>
    </div>

    <footer class="bg-secondary text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Sports Hub. All rights reserved.</p>
        </div>
    </footer>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="standings.js"></script>
</body>
</html>
