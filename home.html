<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News Hub - Home</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <script src="https://cdn.tailwindcss.com"></script>
   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#0f172a',
                        accent: '#f97316',
                        background: '#f8fafc',
                        foreground: '#0f172a',
                        muted: '#64748b',
                        card: '#ffffff',
                        'card-border': '#e2e8f0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen">
    
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">Sports Hub</a>
        <ul>
            <li><a href="home.html" class="nav-link active">Home</a></li>
            <li><a href="standings.html" class="nav-link">Standings</a></li>
            <li><a href="live.html" class="nav-link">Live</a></li>
            <li><a href="stats.html" class="nav-link">Stats</a></li>
        </ul>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
           
            <main class="col-lg-8">
               
                <section class="mb-5">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-1 h-8 bg-accent rounded-full"></div>
                        <h2 class="text-2xl font-bold text-foreground mb-0">Sports</h2>
                    </div>
                    <div class="row g-3" id="sports-news">
                        
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mb-5">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-1 h-8 bg-purple-500 rounded-full"></div>
                        <h2 class="text-2xl font-bold text-foreground mb-0">Entertainment</h2>
                    </div>
                    <div class="row g-3" id="entertainment-news">
                    
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mb-5">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-1 h-8 bg-blue-600 rounded-full"></div>
                        <h2 class="text-2xl font-bold text-foreground mb-0">Politics</h2>
                    </div>
                    <div class="row g-3" id="politics-news">
                
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mb-5">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-1 h-8 bg-green-500 rounded-full"></div>
                        <h2 class="text-2xl font-bold text-foreground mb-0">Economy</h2>
                    </div>
                    <div class="row g-3" id="economy-news">
                        <!-- News cards will be loaded here -->
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <aside class="col-lg-4">
                
                <div class="card border-0 shadow-sm rounded-xl mb-4 overflow-hidden">
                    <div class="card-header bg-gradient-to-r from-primary to-blue-500 text-white border-0 py-3">
                        <h5 class="mb-0 flex items-center gap-2">
                            <i class="bi bi-cloud-sun-fill"></i> Weather
                        </h5>
                    </div>
                    <div class="card-body p-4" id="weather-widget">
                        <div class="text-center py-4">
                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-xl mb-4 overflow-hidden">
                    <div class="card-header bg-gradient-to-r from-green-600 to-emerald-500 text-white border-0 py-3">
                        <h5 class="mb-0 flex items-center gap-2">
                            <i class="bi bi-currency-exchange"></i> Exchange Rates
                        </h5>
                    </div>
                    <div class="card-body p-4" id="exchange-widget">
                        <div class="text-center py-4">
                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-gray-50 border-0 p-4">
                        <h6 class="font-semibold mb-3">Currency Converter</h6>
                        <div class="flex flex-col gap-2">
                            <input type="number" id="convert-amount" class="form-control" placeholder="Amount" value="1">
                            <div class="flex gap-2">
                                <select id="convert-from" class="form-select flex-1">
                                    <option value="EGP">EGP</option>
                                    <option value="USD">USD</option>
                                    <option value="SAR">SAR</option>
                                    <option value="EUR">EUR</option>
                                </select>
                                <select id="convert-to" class="form-select flex-1">
                                    <option value="USD">USD</option>
                                    <option value="EGP">EGP</option>
                                    <option value="SAR">SAR</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                            <button onclick="convertCurrency()" class="btn btn-success w-full">
                                <i class="bi bi-arrow-left-right me-1"></i> Convert
                            </button>
                            <div id="conversion-result" class="text-center font-semibold text-lg text-green-600 mt-2"></div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-xl overflow-hidden">
                    <div class="card-header bg-gradient-to-r from-red-600 to-rose-500 text-white border-0 py-3">
                        <h5 class="mb-0 flex items-center gap-2">
                            <i class="bi bi-broadcast-pin animate-pulse"></i> Live Matches
                        </h5>
                    </div>
                    <div class="card-body p-0" id="live-matches-widget">
                        <div class="text-center py-5">
                            <div class="spinner-border spinner-border-sm text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <footer class="bg-secondary text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Sports Hub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="home.js"></script>
</body>
</html>
