<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News Hub - Live Matches</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#0f172a',
                        accent: '#f97316',
                        background: '#f8fafc',
                        foreground: '#0f172a',
                        muted: '#64748b',
                        card: '#ffffff',
                        'card-border': '#e2e8f0'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen">
   
   <nav class="navbar">
        <a href="home.html" class="navbar-brand">Sports Hub</a>
        <ul>
            <li><a href="home.html" class="nav-link">Home</a></li>
            <li><a href="standings.html" class="nav-link">Standings</a></li>
            <li><a href="live.html" class="nav-link active">Live</a></li>
            <li><a href="stats.html" class="nav-link">Stats</a></li>
        </ul>
    </nav>

    <div class="container py-4">
        <div class="text-center mb-5">
            <h1 class="text-4xl font-bold text-foreground mb-2">
                <i class="bi bi-broadcast text-red-500 animate-pulse me-2"></i>
                Live & Upcoming Matches
            </h1>
            <p class="text-muted">Track all matches - Live, Finished, and Upcoming</p>
        </div>

        <div class="date-filter-container">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="date-from" class="form-label">Date From</label>
                    <input type="date" class="form-control" id="date-from">
                </div>
                <div class="col-md-4">
                    <label for="date-to" class="form-label">Date To</label>
                    <input type="date" class="form-control" id="date-to">
                </div>
                <div class="col-md-2">
                    <label for="team-filter" class="form-label">Team</label>
                    <input type="text" class="form-control" id="team-filter" placeholder="Filter by team">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-full py-2" onclick="searchMatches()">
                        <i class="bi bi-search me-1"></i> Search
                    </button>
                </div>
            </div>
        </div>

        <ul class="nav nav-pills justify-center mb-4 gap-2" id="matchTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active px-4 py-2 rounded-full" id="all-tab" data-bs-toggle="pill" data-bs-target="#all" type="button" role="tab">
                    All Matches
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-4 py-2 rounded-full" id="live-tab" data-bs-toggle="pill" data-bs-target="#live" type="button" role="tab">
                    <i class="bi bi-broadcast-pin text-danger me-1"></i> Live
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-4 py-2 rounded-full" id="finished-tab" data-bs-toggle="pill" data-bs-target="#finished" type="button" role="tab">
                    <i class="bi bi-check-circle text-success me-1"></i> Finished
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-4 py-2 rounded-full" id="upcoming-tab" data-bs-toggle="pill" data-bs-target="#upcoming" type="button" role="tab">
                    <i class="bi bi-clock text-primary me-1"></i> Upcoming
                </button>
            </li>
        </ul>

        <div class="tab-content" id="matchTabsContent">
            <div class="tab-pane fade show active" id="all" role="tabpanel">
                <div id="all-matches" class="row g-3">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="live" role="tabpanel">
                <div id="live-matches" class="row g-3"></div>
            </div>
            <div class="tab-pane fade" id="finished" role="tabpanel">
                <div id="finished-matches" class="row g-3"></div>
            </div>
            <div class="tab-pane fade" id="upcoming" role="tabpanel">
                <div id="upcoming-matches" class="row g-3"></div>
            </div>
        </div>
    </div>

    <footer class="bg-secondary text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Sports Hub. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="live.js"></script>
</body>
</html>
